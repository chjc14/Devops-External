
<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>My Image Gallery</h1>

    <div class="gallery">

        <div class="image">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=500" alt="Nature">
            <h3>Beautiful Nature</h3>
        </div>

        <div class="image">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=500" alt="Mountains">
            <h3>Mountain View</h3>
        </div>

        <div class="image">
            <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=500" alt="Lake">
            <h3>Peaceful Lake</h3>
        </div>

        <div class="image">
            <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=500" alt="Sunrise">
            <h3>Beautiful Sunrise</h3>
        </div>

    </div>

</body>
</html>
