
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pizza
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pizza
  template:
    metadata:
      labels:
        app: pizza
    spec:
      containers:
      - name: pizza
        image: pizza-app
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
